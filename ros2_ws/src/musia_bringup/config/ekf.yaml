# robot_localization : odométrie du robot SANS encodeur de roue.
# Sources : odométrie laser (rf2o, vitesses dans le plan) + gyroscope du MPU-6050 (vitesse de lacet).
# L'ancienne configuration ne fusionnait que l'IMU : une position obtenue en intégrant
# deux fois l'accéléromètre dérive de plusieurs mètres en quelques secondes.
ekf_node:
  ros__parameters:
    frequency: 20.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_rf2o
    #            x      y      z      roll   pitch  yaw
    #            vx     vy     vz     vroll  vpitch vyaw
    #            ax     ay     az
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_differential: false

    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_remove_gravitational_acceleration: false
