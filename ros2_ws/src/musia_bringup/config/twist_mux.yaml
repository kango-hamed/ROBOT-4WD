# Qui commande les moteurs ? twist_mux choisit la source la plus prioritaire encore active
# et publie sur /cmd_vel, le seul topic lu par base_node.
#
#   arrêt d'urgence (/musia/estop = true)  bloque tout, jusqu'à ce qu'on le relâche
#   pilote manuel   (/cmd_vel_teleop)      page de pilotage ou clavier : reprend la main
#   navigation      (/cmd_vel_auto)        Nav2, après son contrôle anticollision
#
# Une source se tait plus de « timeout » secondes : la suivante reprend.
twist_mux:
  ros__parameters:
    topics:
      pilote:
        topic: cmd_vel_teleop
        timeout: 0.5
        priority: 100
      navigation:
        topic: cmd_vel_auto
        timeout: 0.5
        priority: 10
    locks:
      arret_urgence:
        topic: musia/estop
        timeout: 0.0          # 0 : le verrou reste dans le dernier état publié
        priority: 255
